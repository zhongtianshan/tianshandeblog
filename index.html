  <!-- 背景音乐：Web Audio API 预解码 + 零延迟启动 -->
  <script>
    var musicPlaying = false;
    var musicBtn = document.getElementById('music-btn');
    var musicVolume = 0.4;
    // 降级用 Audio 元素
    var _fallbackAudio = new Audio('audio/m.mp3');
    _fallbackAudio.loop = true;
    _fallbackAudio.volume = musicVolume;
    _fallbackAudio.preload = 'auto';
    _fallbackAudio.load();

    // Web Audio API 预解码（无需用户交互，后台完成）
    var _ctx = null;
    var _decoded = null;
    var _source = null;
    var _startTime = 0;
    var _pauseTime = 0;
    try { _ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    if (_ctx) {
      fetch('audio/m.mp3').then(function(r) { return r.arrayBuffer(); }).then(function(buf) {
        _ctx.decodeAudioData(buf, function(buffer) {
          _decoded = buffer;
          if (musicBtn) musicBtn.classList.remove('loading');
        });
      }).catch(function(){});
    }

    musicBtn.classList.add('loading');
    _syncMusicUI();

    function _syncMusicUI() {
      musicBtn.textContent = musicPlaying ? '♫' : '♪';
      musicBtn.classList.toggle('on', musicPlaying);
      var mi = document.querySelectorAll('.hm-item');
      if (mi[0]) {
        mi[0].textContent = (musicPlaying ? '♫' : '♪') + ' 背景音乐';
        mi[0].classList.toggle('hm-on', musicPlaying);
      }
    }

    function _playWasm(offset) {
      if (!_ctx || !_decoded) {
        _fallbackAudio.currentTime = offset || 0;
        var _fp = _fallbackAudio.play();
        if (_fp && _fp.then) {
          _fp.then(function() {
            musicPlaying = true;
            _syncMusicUI();
          }).catch(function(){});
        } else {
          musicPlaying = true;
          _syncMusicUI();
        }
        return;
      }

      function doPlay() {
        if (_source) { try { _source.stop(); } catch(e) {} _source = null; }
        _source = _ctx.createBufferSource();
        _source.buffer = _decoded;
        _source.loop = true;
        var g = _ctx.createGain();
        g.gain.value = musicVolume;
        _source.connect(g);
        g.connect(_ctx.destination);
        _source.start(0, offset || 0);
        _startTime = (_ctx.currentTime || 0) - (offset || 0);
        musicPlaying = true;
        _syncMusicUI();
      }

      if (_ctx.state === 'suspended') {
        _ctx.resume().then(doPlay).catch(function() {
          // resume 失败 → 降级到 Audio 元素
          _fallbackAudio.currentTime = offset || 0;
          var _fp2 = _fallbackAudio.play();
          if (_fp2 && _fp2.then) {
            _fp2.then(function() {
              musicPlaying = true;
              _syncMusicUI();
            }).catch(function(){});
          } else {
            musicPlaying = true;
            _syncMusicUI();
          }
        });
      } else {
        doPlay();
      }
    }

    function _stopWasm() {
      if (_source) { try { _source.stop(); } catch(e) {} _source = null; }
      musicPlaying = false;
      _syncMusicUI();
    }

    function toggleMusic() {
      if (musicPlaying) {
        _pauseTime = _source ? ((_ctx.currentTime || 0) - _startTime) % _decoded.duration : (_fallbackAudio.currentTime || 0);
        _stopWasm();
        _fallbackAudio.pause();
        _syncMusicUI();
      } else {
        _playWasm(_pauseTime);
        _syncMusicUI();
      }
    }

    (function() {
      var mi = document.querySelectorAll('.hm-item');
      if (mi[1]) mi[1].classList.add('hm-on');
      if (mi[2]) mi[2].classList.add('hm-on');
    })();

    // 自动启动背景音乐：首次用户交互（点击/按键）时播放
    // 注意：只用 click，不用 touchstart——手机端滚动也会触发 touchstart
    // 但不会被浏览器视为有效手势，导致播放失败后 UI 误显示为播放中
    // 等开机动画完成后再绑定交互监听，避免在开机期间误触发
    (function() {
      var _enabled = false;
      function _enableAutoPlay() {
        if (_enabled) return;
        _enabled = true;
        var _autoStarted = false;
        function _autoPlay() {
          if (_autoStarted) return;
          _autoStarted = true;
          document.removeEventListener('click', _autoPlay);
          document.removeEventListener('keydown', _autoPlay);
          // 开机动画还在进行？等结束再播
          var _overlay = document.getElementById('boot-overlay');
          if (_overlay && !_overlay.classList.contains('hidden')) {
            window.addEventListener('boot-complete', function() {
              if (!musicPlaying) { _pauseTime = 0; _playWasm(0); }
            });
            return;
          }
          if (!musicPlaying) {
            _pauseTime = 0;
            _playWasm(0);
          }
        }
        document.addEventListener('click', _autoPlay);
        document.addEventListener('keydown', _autoPlay);
      }

      // 等 boot-complete 事件后启用自动播放
      window.addEventListener('boot-complete', _enableAutoPlay);
      // 兜底：如果 5 秒后还没触发（比如 boot-complete 没发出），也启用
      setTimeout(function() {
        _enableAutoPlay();
      }, 5000);
    })();
  </script>

  <!-- 帧动画背景（延后加载：把带宽优先让给音频） -->
  <script>
    (function(){
      var total = 855, cur = 1, fps = 24, running = true;
      var bg = document.getElementById('video-bg');
      var img = document.createElement('img');
      img.id = 'frame-player';
      bg.appendChild(img);
      var ov = document.createElement('div');
      ov.id = 'video-overlay';
      bg.appendChild(ov);

      function pad(x) {
        return (x < 10 ? '000' : x < 100 ? '00' : x < 1000 ? '0' : '') + x;
      }

      // blob 缓存：fetch → ObjectURL，加载一次后零网络
      var blobs = [];

      function cacheOne(idx) {
        var url = 'frames/f_' + pad(idx) + '.jpg';
        fetch(url).then(function(r) { return r.ok ? r.blob() : null; })
          .then(function(b) { if (b) blobs[idx] = URL.createObjectURL(b); })
          .catch(function(){});
      }

      // 第一帧立刻显示，同时后台缓存
      img.src = 'frames/f_' + pad(1) + '.jpg';
      cacheOne(1);

      // 等 2 秒让音频先走，然后缓存剩余帧（每次并发 8 个）
      setTimeout(function() {
        var next = 2;
        function nextBatch() {
          for (var i = 0; i < 8 && next <= total; i++) {
            cacheOne(next);
            next++;
          }
          if (next <= total) setTimeout(nextBatch, 100);
        }
        nextBatch();
      }, 2000);

      // 动画循环：优先用 blob，没有则走网络
      setInterval(function() {
        if (!running) return;
        cur = (cur % total) + 1;
        img.src = blobs[cur] || 'frames/f_' + pad(cur) + '.jpg';
      }, 1000 / fps);
    })();
  </script>

  <!-- 鼠标涟漪拖尾（Neon Ripple Trail） -->
  <script>
    (function() {
      if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;

      var canvas = document.createElement('canvas');
      canvas.id = 'particle-trail';
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10198';
      document.body.appendChild(canvas);

      var ctx = canvas.getContext('2d');
      var W, H;
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);

      var ripples = [];
      var sparks = [];
      var lastX = 0, lastY = 0, moved = false;
      var _fc = 0;

      document.addEventListener('mousemove', function(e) {
        if (!moved) { lastX = e.clientX; lastY = e.clientY; moved = true; return; }
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 5) {
          // 涟漪
          ripples.push({
            x: e.clientX, y: e.clientY,
            r: 4, maxR: Math.min(40 + dist * 0.5, 90),
            life: 1, decay: 0.015 + Math.random() * 0.01,
            hue: 180 + Math.random() * 60
          });
          // 迸射火星
          var n = Math.min(Math.floor(dist * 0.15), 6);
          for (var i = 0; i < n; i++) {
            var a = Math.atan2(-dy, -dx) + (Math.random() - 0.5) * 1.8;
            var s = Math.random() * 2 + 0.5;
            sparks.push({
              x: e.clientX + (Math.random() - 0.5) * 6,
              y: e.clientY + (Math.random() - 0.5) * 6,
              vx: Math.cos(a) * s + (Math.random() - 0.5) * 0.5,
              vy: Math.sin(a) * s + (Math.random() - 0.5) * 0.5,
              size: Math.random() * 3 + 1,
              hue: 180 + Math.random() * 180,
              life: 1, decay: 0.02 + Math.random() * 0.02
            });
          }
          // 限制数量
          if (ripples.length > 30) ripples.shift();
          if (sparks.length > 150) sparks.splice(0, sparks.length - 150);
        }
        lastX = e.clientX;
        lastY = e.clientY;
      });

      // 点击爆发 → 大涟漪
      document.addEventListener('click', function(e) {
        for (var k = 0; k < 3; k++) {
          ripples.push({
            x: e.clientX + (Math.random() - 0.5) * 20,
            y: e.clientY + (Math.random() - 0.5) * 20,
            r: 5, maxR: 120 + Math.random() * 40,
            life: 1, decay: 0.008,
            hue: Math.random() * 360
          });
        }
        for (var i = 0; i < 30; i++) {
          var a = Math.random() * Math.PI * 2;
          var s = Math.random() * 4 + 1;
          sparks.push({
            x: e.clientX, y: e.clientY,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            size: Math.random() * 4 + 1,
            hue: Math.random() * 360,
            life: 1, decay: 0.015 + Math.random() * 0.01
          });
        }
      });

      function animate() {
        ctx.clearRect(0, 0, W, H);
        _fc++;

        // 更新 + 绘制涟漪
        for (var i = ripples.length - 1; i >= 0; i--) {
          var rp = ripples[i];
          rp.r += (rp.maxR - rp.r) * 0.08;
          rp.life -= rp.decay;
          if (rp.life <= 0) { ripples.splice(i, 1); continue; }
          var alpha = rp.life * 0.35;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.strokeStyle = 'hsl(' + rp.hue + ', 100%, 60%)';
          ctx.lineWidth = 1.5 * rp.life;
          ctx.shadowColor = 'hsl(' + rp.hue + ', 100%, 60%)';
          ctx.shadowBlur = 12;
          ctx.stroke();
        }
        ctx.shadowBlur = 0;

        // 更新 + 绘制火星
        for (var i = sparks.length - 1; i >= 0; i--) {
          var sp = sparks[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.vy += 0.04;
          sp.life -= sp.decay;
          if (sp.life <= 0) { sparks.splice(i, 1); continue; }
          ctx.globalAlpha = sp.life * 0.8;
          ctx.fillStyle = 'hsl(' + sp.hue + ', 100%, 70%)';
          ctx.shadowColor = 'hsl(' + sp.hue + ', 100%, 60%)';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size * sp.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>


  <!-- 边缘字母粒子特效 -->
  <script>
    (function() {
      var canvas = document.createElement('canvas');
      canvas.id = 'edge-letters';
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:101';
      document.body.appendChild(canvas);

      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var W, H;
      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);
      // 手机版降低上限保性能
      var isMobile = !window.matchMedia || !window.matchMedia('(pointer: fine)').matches;
      var MAX_PARTICLES = isMobile ? 60 : 150;

      var particles = [];
      var colors = ['#ff0040', '#ff6600', '#ffd700', '#00ff41', '#00f0ff'];
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

      function canSpawnAt(scrollY, edge) {
        var docH = document.documentElement.scrollHeight;
        if (edge === 2) return scrollY < 5;                    // 顶边：只在最顶部
        if (edge === 3) return scrollY + H >= docH - 5;        // 底边：只在最底部
        return true;                                            // 左右边：始终
      }

      function spawnParticle() {
        var edge = Math.floor(Math.random() * 4);
        if (!canSpawnAt(window.scrollY, edge)) return;
        var x, y, vx, vy;
        switch(edge) {
          case 0:
            x = 0;
            y = Math.random() * H;
            vx = Math.random() * 0.6 + 0.3;
            vy = (Math.random() - 0.5) * 0.3;
            break;
          case 1:
            x = W;
            y = Math.random() * H;
            vx = -(Math.random() * 0.6 + 0.3);
            vy = (Math.random() - 0.5) * 0.3;
            break;
          case 2:
            x = Math.random() * W;
            y = 0;
            vx = (Math.random() - 0.5) * 0.3;
            vy = Math.random() * 0.6 + 0.3;
            break;
          case 3:
            x = Math.random() * W;
            y = H;
            vx = (Math.random() - 0.5) * 0.3;
            vy = -(Math.random() * 0.6 + 0.3);
            break;
        }

        particles.push({
          x: x, y: y, vx: vx, vy: vy,
          char: chars[Math.floor(Math.random() * chars.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 14 + 10,
          life: 1,
          decay: Math.random() * 0.012 + 0.002
        });
      }

      // 每 200-500ms 随机生成一个
      function scheduleSpawn() {
        setTimeout(function() {
          if (particles.length < MAX_PARTICLES) { spawnParticle(); if (Math.random() < 0.4) spawnParticle(); }
          scheduleSpawn();
        }, Math.random() * 100 + 50);
      }
      scheduleSpawn();

      function animate() {
        ctx.clearRect(0, 0, W, H);
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          var alpha = 0.5 * p.life;
          ctx.globalAlpha = alpha;
          ctx.font = p.size + 'px "Minecraft", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 12;
          ctx.fillStyle = p.color;
          ctx.fillText(p.char, p.x, p.y);
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>


  <!-- ===== 开机动画 ===== -->
  <script>
    (function() {
      var overlay = document.getElementById('boot-overlay');
      if (!overlay) return;

      // sessionStorage 检测（try/catch 兼容隐私模式）
      var isFirstLoad = true;
      try { isFirstLoad = !sessionStorage.getItem('tianshan-booted'); } catch(e) {}

      if (!isFirstLoad) {
        overlay.style.display = 'none';
        window.dispatchEvent(new CustomEvent('boot-complete'));
        return;
      }

      var terminal = document.getElementById('boot-terminal');
      var titleEl = document.getElementById('boot-title');

      // 点击遮罩只解锁音频，不跳过
      var _skipped = false;
      var _phaseTimer = null;

      // 右上角 SKIP 按钮
      document.getElementById('boot-skip').addEventListener('click', function(e) {
        e.stopPropagation();
        if (_skipped) return;
        _skipped = true;
        if (_phaseTimer) clearTimeout(_phaseTimer);
        if (_cascadeTimer) clearTimeout(_cascadeTimer);
        overlay.classList.add('fade-out');
        setTimeout(function() {
          removeOverlay();
        }, 300);
      });

      // ===== Phase 1: 终端代码瀑布（真实 Linux 启动日志） =====
      var _bootLines = [
        '> [LINUX] Linux version 6.1.42-arch1-1 (linux@archlinux)',

      var _lineEls = [];
      var _lineIdx = 0, _charPos = 0;
      var _cascadeTimer = null;

      // 清空 terminal 并动态创建行元素
      terminal.innerHTML = '';
      _bootLines.forEach(function() {
        var el = document.createElement('div');
        terminal.appendChild(el);
        _lineEls.push(el);
      });

      // 逐行打字
      function typeNextLine() {
        if (_skipped) return;
        if (_lineIdx >= _bootLines.length) {
          showContinuePrompt();
          return;
        }
        var text = _bootLines[_lineIdx];
        var el = _lineEls[_lineIdx];

        if (_lineIdx < 5) {
          // 前5行逐字打出
          var baseSpeed = _lineIdx === 0 ? 20 :
                         _lineIdx === 1 ? 12 :
                         _lineIdx < 4 ? 6 : 3;
          _charPos = 0;
          function tick() {
            if (_skipped) return;
            el.textContent += text[_charPos];
            _charPos++;
            if (_charPos >= text.length) {
              _lineIdx++;
              terminal.scrollTop = terminal.scrollHeight;
              var gap = _lineIdx < 2 ? 180 : _lineIdx < 4 ? 80 : 30;
              _cascadeTimer = setTimeout(typeNextLine, gap);
              return;
            }
            if (terminal.scrollTop > terminal.scrollHeight - terminal.clientHeight - 60) {
              terminal.scrollTop = terminal.scrollHeight;
            }
            var delay = baseSpeed;
            if (_lineIdx === 0 && Math.random() < 0.1) delay = 120 + Math.random() * 150;
            if (_lineIdx === 1 && Math.random() < 0.05) delay = 60 + Math.random() * 100;
            _cascadeTimer = setTimeout(tick, delay);
          }
          tick();
        } else {
          // 第6行起：整行闪现，行间隔逐渐缩短
          el.textContent = text;
          _lineIdx++;
          terminal.scrollTop = terminal.scrollHeight;
          var gap = _lineIdx < 20 ? 40 : _lineIdx < 50 ? 20 : 10;
          _cascadeTimer = setTimeout(typeNextLine, gap);
        }
      }
      typeNextLine();

      // 代码跑完后显示点击继续
      function showContinuePrompt() {
        if (_skipped) return;
        // 在末尾追加一行 "> 点击任意继续"
        var promptEl = document.createElement('div');
        promptEl.id = 'boot-continue';
        terminal.appendChild(promptEl);
        var text = '> 点击任意继续';
        var i = 0;
        var iv = setInterval(function() {
          if (_skipped) { clearInterval(iv); return; }
          promptEl.textContent += text[i];
          i++;
          if (i >= text.length) {
            clearInterval(iv);
            // 打字完成后确保可见
            terminal.scrollTop = terminal.scrollHeight;
          }
        }, 25);
        // 立即滚一次
        terminal.scrollTop = terminal.scrollHeight;
        // 再延迟滚一次（确保 DOM 渲染完毕）
        setTimeout(function() {
          terminal.scrollTop = terminal.scrollHeight;
        }, 100);
        // 一次点击 → 解锁音频 + 进入崩坏
        overlay.addEventListener('click', function _cont() {
          if (_skipped) return;
          overlay.removeEventListener('click', _cont);
          clearInterval(iv);
          promptEl.textContent = text;
          terminal.scrollTop = terminal.scrollHeight;
          _unlockGlitch();
          revealTitle();

      // ===== Web Audio 崩坏音效 =====
      var _glitchCtx = null;
      var _glitchQueue = [];

      // 立即创建 AudioContext（可能被 suspend，但后续可 resume）
      try { _glitchCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}

      // 状态变化时自动刷队列（比如 resume 成功后）
      if (_glitchCtx) {
        _glitchCtx.onstatechange = function() {
          if (_glitchCtx.state === 'running' && _glitchQueue.length) {
            var q = _glitchQueue.slice();
            _glitchQueue = [];
            q.forEach(function(play) { try { play(); } catch(e) {} });
            _glitchCtx.onstatechange = null;
          }
        };
      }

      // 首次交互时强制解锁 + 刷队列
      function _unlockGlitch() {
        document.removeEventListener('click', _unlockGlitch);
        document.removeEventListener('touchstart', _unlockGlitch);
        document.removeEventListener('keydown', _unlockGlitch);
        // 隐藏等待提示
        var hint = document.getElementById('boot-audio-hint');
        if (hint) hint.style.opacity = '0';
        if (_glitchCtx && _glitchCtx.state === 'suspended') {
          _glitchCtx.resume().catch(function(){});
        }
        // 刷队列
        var q = _glitchQueue.slice();
        _glitchQueue = [];
        q.forEach(function(play) { try { play(); } catch(e) {} });
      }
      document.addEventListener('click', _unlockGlitch);
      document.addEventListener('touchstart', _unlockGlitch);
      document.addEventListener('keydown', _unlockGlitch);

      function playGlitch(duration, intensity) {
        try {
          // 尝试唤醒（某些浏览器允许非手势 resume）
          if (_glitchCtx && _glitchCtx.state === 'suspended') {
            _glitchCtx.resume().catch(function(){});
          }
          if (_glitchCtx && _glitchCtx.state === 'running') {
            buildGlitchSound(duration, intensity);
            return;
          }
          // 还没 running → 存队列
          var _d = duration, _i = intensity;
          _glitchQueue.push(function() {
            try { if (_glitchCtx) buildGlitchSound(_d, _i); } catch(e) {}
          });
        } catch(e) {}
      }

      // 合成崩坏音效：故意做糙，旧电脑死机撕裂感
      function buildGlitchSound(duration, intensity) {
        var ctx = _glitchCtx;
        var t = ctx.currentTime;

        // 共用失真效果（硬削波）
        var shaper = ctx.createWaveShaper();
        var curve = new Float32Array(256);
        for (var i = 0; i < 256; i++) {
          var x = (i / 128) - 1;
          curve[i] = Math.tanh(x * 3);
        }
        shaper.curve = curve;

        if (duration > 0.3) {
          // ====== 主崩坏 (0.6s) ======
          // 方波 + 失真 = 粗暴撕裂声
          var osc = ctx.createOscillator();
          osc.type = 'square';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.linearRampToValueAtTime(120, t + 0.08);
          osc.frequency.exponentialRampToValueAtTime(30, t + duration);
          var g = ctx.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.6 * intensity, t + 0.03);
          g.gain.setValueAtTime(0.5 * intensity, t + 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, t + duration);

          // 第二层：更高频的方波错乱感
          var osc2 = ctx.createOscillator();
          osc2.type = 'square';
          osc2.frequency.setValueAtTime(1800, t);
          osc2.frequency.linearRampToValueAtTime(900, t + 0.06);
          osc2.frequency.exponentialRampToValueAtTime(40, t + duration);
          var g2 = ctx.createGain();
          g2.gain.setValueAtTime(0, t);
          g2.gain.linearRampToValueAtTime(0.25 * intensity, t + 0.04);
          g2.gain.exponentialRampToValueAtTime(0.001, t + duration * 0.6);

          // 噪声层：硬失真白噪
          var sr = ctx.sampleRate || 44100;
          var bufSize = Math.floor(sr * duration);
          var buf = ctx.createBuffer(1, bufSize, sr);
          var data = buf.getChannelData(0);
          for (var i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
          var noise = ctx.createBufferSource();
          noise.buffer = buf;
          var gn = ctx.createGain();
          gn.gain.setValueAtTime(0.3 * intensity, t);
          gn.gain.exponentialRampToValueAtTime(0.001, t + duration * 0.5);

          // 方波1 → 失真 → 输出
          osc.connect(shaper);
          shaper.connect(g);
          g.connect(ctx.destination);
          // 方波2 直出
          osc2.connect(g2);
          g2.connect(ctx.destination);
          // 噪声 → 失真 → 输出
          noise.connect(gn);
          gn.connect(ctx.destination);

          osc.start(t); osc.stop(t + duration + 0.05);
          osc2.start(t); osc2.stop(t + duration + 0.05);
          noise.start(t); noise.stop(t + duration);
        } else {
          // ====== 二次崩坏 (0.15-0.2s) ======
          // 参考主崩坏的感觉，但平一点：正弦快速下落 + 轻颤
          var o1 = ctx.createOscillator();
          o1.type = 'sine';
          o1.frequency.setValueAtTime(440, t);
          o1.frequency.exponentialRampToValueAtTime(60, t + duration);
          var g1 = ctx.createGain();
          g1.gain.setValueAtTime(0, t);
          g1.gain.linearRampToValueAtTime(0.35 * intensity, t + 0.01);
          g1.gain.exponentialRampToValueAtTime(0.001, t + duration);

          var o2 = ctx.createOscillator();
          o2.type = 'sine';
          o2.frequency.setValueAtTime(880, t);
          o2.frequency.linearRampToValueAtTime(400, t + duration * 0.3);
          o2.frequency.exponentialRampToValueAtTime(40, t + duration);
          var g2 = ctx.createGain();
          g2.gain.setValueAtTime(0, t);
          g2.gain.linearRampToValueAtTime(0.15 * intensity, t + 0.02);
          g2.gain.exponentialRampToValueAtTime(0.001, t + duration * 0.7);

          o1.connect(g1); g1.connect(ctx.destination);
          o2.connect(g2); g2.connect(ctx.destination);
          o1.start(t); o1.stop(t + duration + 0.05);
          o2.start(t); o2.stop(t + duration + 0.05);
        }
      }

      // ===== Phase 3: 标题 Glitch 揭示 =====
      function revealTitle() {
        if (_skipped) return;
        terminal.style.display = 'none';
        titleEl.style.display = 'block';
        void titleEl.offsetWidth;
        titleEl.classList.add('reveal');
        // 主崩坏音效
        playGlitch(0.6, 0.7);
        // 主崩坏 1.5s 结束后，触发结尾二次崩坏
        _phaseTimer = setTimeout(triggerFinalBurst, 1800);
      }

      // ===== Phase 4: 结尾二次崩坏 → 淡出 =====
      function triggerFinalBurst() {
        if (_skipped) return;
        // 清除 reveal 动画，回到稳定可见状态
        titleEl.classList.remove('reveal');
        titleEl.style.opacity = '1';
        titleEl.style.transform = 'translate(-50%, -50%)';
        titleEl.style.clipPath = 'inset(0 0 0 0)';
        void titleEl.offsetWidth;
        titleEl.classList.add('glitch-burst');
        // 两次崩坏音效（平一点，不抢主崩坏）
        playGlitch(0.15, 0.35);
        setTimeout(function() { if (!_skipped) playGlitch(0.18, 0.45); }, 300);
        _phaseTimer = setTimeout(fadeOut, 900);
      }

      // ===== Phase 5: 淡出 =====
      function fadeOut() {
        if (_skipped) return;
        overlay.classList.add('fade-out');
        _phaseTimer = setTimeout(removeOverlay, 800);
      }

      function removeOverlay() {
        overlay.classList.add('hidden');
        try { sessionStorage.setItem('tianshan-booted', 'true'); } catch(e) {}
        window.dispatchEvent(new CustomEvent('boot-complete'));
      }
    })();

  <script>
    (function() {
      var h1 = document.querySelector('header h1');
      var subtitle = document.querySelector('header .subtitle');
      if (!h1 || !subtitle) return;

      var fullText = h1.textContent.trim();

      // sessionStorage 检测是否首次加载
      var isFirstLoad = true;
      try { isFirstLoad = !sessionStorage.getItem('tianshan-booted'); } catch(e) {}

      function startTypewriter() {
        h1.textContent = '';
        h1.classList.add('typewriter');
        var idx = 0;
        var typeInterval = setInterval(function() {
          if (idx < fullText.length) {
            h1.textContent += fullText[idx];
            idx++;
          } else {
            clearInterval(typeInterval);
            h1.classList.remove('typewriter');
            setTimeout(function() {
              subtitle.classList.add('fade-in');
            }, 300);
          }
        }, 60);
      }

      // 非首次加载：跳过打字机，直接显示标题，副标题淡入
      if (!isFirstLoad) {
        h1.textContent = fullText;
        setTimeout(function() {
          subtitle.classList.add('fade-in');
        }, 300);
        return;
      }

      // 首次加载：等开机动画完成
      var bootTimer = setTimeout(startTypewriter, 4500);
      window.addEventListener('boot-complete', function() {
        clearTimeout(bootTimer);
        startTypewriter();
      });
    })();
  </script>

  <script>

      bars.forEach(function(b) { b.style.display = display; });

    // ===== 背景亮度滑条（磁铁吸附 + 震动） =====
    (function() {
      var overlay = document.getElementById('video-overlay');
      if (!overlay) return;
      var DEF = 65, SNAP = 5;
      var cur = DEF, inSnap = false;
      // 两个 slider 实例：汉堡菜单 + PC 弹窗
      var sliders = [
        { s: document.getElementById('bg-brightness-slider'), f: document.getElementById('bg-brightness-fill'), t: document.getElementById('bg-brightness-thumb') },
        { s: document.getElementById('bg-brightness-pc'), f: document.getElementById('bg-brightness-fill-pc'), t: document.getElementById('bg-brightness-thumb-pc') }
      ].filter(function(o) { return o.s; });

      function set(v, snap) {
        cur = Math.max(0, Math.min(100, v));
        overlay.style.background = 'rgba(0,0,0,' + (cur/100) + ')';
        sliders.forEach(function(o) {
          o.f.style.width = cur + '%';
          o.f.style.transition = snap ? '' : 'none';
          if (o.t) {
            o.t.style.left = cur + '%';
            o.t.style.transition = snap ? '' : 'none';
          }
        });
      }

      var activeSlider = null;
      function pos(e) {
        if (!activeSlider) return 0;
        var r = activeSlider.getBoundingClientRect();
        var x = e.touches ? e.touches[0].clientX : e.clientX;
        return Math.max(0, Math.min(100, (x - r.left) / r.width * 100));
      }

      function start(e, s) {
        activeSlider = s;
        e.preventDefault();
        var p = pos(e);
        inSnap = Math.abs(p - DEF) <= SNAP;
        set(p);

        function move(e) {
          e.preventDefault();
          var p = pos(e);
          var now = Math.abs(p - DEF) <= SNAP;
          if (now && !inSnap && navigator.vibrate) navigator.vibrate(10);
          inSnap = now;
          set(p);
        }
        function end() {
          if (Math.abs(cur - DEF) <= SNAP) {
            set(DEF, true);
            if (navigator.vibrate) navigator.vibrate(15);
            setTimeout(function() {
              sliders.forEach(function(o) { if (o.t) o.t.classList.remove('snapping'); });
            }, 300);
          }
          activeSlider = null;
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', end);
          document.removeEventListener('touchmove', move);
          document.removeEventListener('touchend', end);
          document.removeEventListener('touchcancel', end);
        }
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', end);
        document.addEventListener('touchmove', move, { passive: false });
        document.addEventListener('touchend', end);
        document.addEventListener('touchcancel', end);
      }

      set(DEF);
      sliders.forEach(function(o) {
        o.s.addEventListener('mousedown', function(e) { start(e, o.s); });
        o.s.addEventListener('touchstart', function(e) { start(e, o.s); }, { passive: false });
      });

      // 暴露给 toggleBrightness 用
      window._brightnessPopup = document.getElementById('brightness-popup');
    })();

    function toggleBrightness() {
      var p = document.getElementById('brightness-popup');
      if (!p) return;
      p.classList.toggle('open');
    }
    // 点击外部关闭亮度弹窗
    document.addEventListener('click', function(e) {
      var p = document.getElementById('brightness-popup');
      var btn = document.getElementById('toggle-brightness');
      if (p && p.classList.contains('open') && !p.contains(e.target) && e.target !== btn) {
        p.classList.remove('open');
      }
    });

    function closeHamburger() {
      var btn = document.getElementById('hamburger');
      var menu = document.getElementById('hamburger-menu');
      menu.classList.remove('open');
      btn.classList.remove('open');
    }

    // 点击汉堡菜单外部关闭菜单
    document.addEventListener('click', function(e) {
      var menu = document.getElementById('hamburger-menu');
      var btn = document.getElementById('hamburger');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
        btn.classList.remove('open');
      }
    });
  </script>

  <!-- 不注册 Service Worker，全部走网络 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(function(r) { if (r) r.unregister(); });
    }
  </script>
