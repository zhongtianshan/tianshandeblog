<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIANSHAN BLOG // CYBERSPACE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 视频背景（由 JS 动态加载） -->
  <div id="video-bg"></div>

  <!-- 头部 -->
  <header>
    <h1>// TIANSHAN //</h1>
    <div class="subtitle">_ <span>B</span>L<span>O</span>G _</div>
    <div class="scanline-header"></div>
    <div class="music-btn" id="music-btn" onclick="toggleMusic()">♪</div>
  </header>

  <!-- 主内容 -->
  <div class="container">

    <!-- 标签切换 -->
    <div class="tabs">
      <span class="tab tab-active" data-tab="posts" onclick="switchTab('posts')">// 文章</span>
      <span class="tab" data-tab="gallery" onclick="switchTab('gallery')">// 影像库</span>
    </div>

    <!-- 文章列表 -->
    <div id="post-list"></div>

    <!-- 空白状态 -->
    <div id="status">
      <span class="glitch">正在连接...</span>
    </div>

    <!-- 文章阅读视图 -->
    <div id="post-view">
      <button class="back-btn" onclick="goBack()"><< 返回列表</button>
      <div class="post-content" id="post-content"></div>
    </div>

    <!-- 图片画廊 -->
    <div class="gallery" id="gallery" style="display:none;">
      <h2>// 影像库 //</h2>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>

  </div>

  <!-- 图片放大查看 -->
  <div id="lightbox" onclick="closeLightbox(event)">
    <span id="lightbox-close" onclick="closeLightbox()">X</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <!-- 页脚 -->
  <footer>
    <span>✦</span> TI<span>A</span>NSHAN BLOG <span>✦</span><br>
    <small>Powered by Markdown + Cyberpunk</small>
  </footer>

  <!-- 帧动画背景（855 张图片 24fps，纯定时驱动，非视频 IDM 无法识别） -->
  <script>
    (function(){
      var total = 855, cur = 1, fps = 24, running = true;
      var bg = document.getElementById('video-bg');
      var img = document.createElement('img');
      img.id = 'frame-player';
      bg.appendChild(img);
      var ov = document.createElement('div');
      ov.id = 'video-overlay';
      bg.appendChild(ov);

      function pad(x) {
        return (x < 10 ? '000' : x < 100 ? '00' : x < 1000 ? '0' : '') + x;
      }

      // 预加载
      for (var k = 1; k <= total; k++) {
        var c = new Image();
        c.src = 'frames/f_' + pad(k) + '.jpg';
      }

      img.src = 'frames/f_' + pad(1) + '.jpg';

      setInterval(function() {
        if (!running) return;
        cur++;
        if (cur > total) cur = 1;
        img.src = 'frames/f_' + pad(cur) + '.jpg';
      }, 1000 / fps);
    })();
  </script>

  <!-- 背景音乐 -->
  <script>
    var musicPlaying = false;
    var musicBtn = document.getElementById('music-btn');
    var music = new Audio(atob('YXVkaW8vbS5tcDM='));
    music.loop = true;
    music.volume = 0.4;

    function toggleMusic() {
      if (musicPlaying) {
        music.pause();
        musicBtn.textContent = '♪';
        musicBtn.classList.remove('on');
        musicPlaying = false;
      } else {
        music.play().catch(function(){});
        musicBtn.textContent = '♫';
        musicBtn.classList.add('on');
        musicPlaying = true;
      }
    }

    // 尝试自动播放
    music.play().then(function() {
      musicBtn.textContent = '♫';
      musicBtn.classList.add('on');
      musicPlaying = true;
    }).catch(function() {
      // 浏览器阻止自动播放，首次点击页面任意位置时启动
      var startOnce = function() {
        if (!musicPlaying) {
          music.play().catch(function(){});
          musicBtn.textContent = '♫';
          musicBtn.classList.add('on');
          musicPlaying = true;
        }
        document.removeEventListener('click', startOnce);
        document.removeEventListener('touchstart', startOnce);
      };
      document.addEventListener('click', startOnce);
      document.addEventListener('touchstart', startOnce);
    });
  </script>

  <!-- marked.js -->
  <script src="js/marked.min.js"></script>
  <!-- 博客数据（加时间戳防缓存） -->
  <script>document.write('<script src="data.js?_='+Date.now()+'"><\/script>');</script>
  <!-- 主脚本 -->
  <script src="js/main.js"></script>

</body>
</html>
