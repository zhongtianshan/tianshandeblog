<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIANSHAN BLOG // CYBERSPACE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 视频背景（由 JS 动态加载） -->
  <div id="video-bg"></div>

  <!-- 头部 -->
  <header>
    <h1>// TIANSHAN //</h1>
    <div class="subtitle">_ <span>B</span>L<span>O</span>G _</div>
    <div class="scanline-header"></div>
    <div class="music-btn" id="music-btn" onclick="toggleMusic()">♪</div>
  </header>

  <!-- 主内容 -->
  <div class="container">

    <!-- 标签切换 -->
    <div class="tabs">
      <span class="tab tab-active" data-tab="posts" onclick="switchTab('posts')">// 文章</span>
      <span class="tab" data-tab="gallery" onclick="switchTab('gallery')">// 影像库</span>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索文章..." oninput="searchPosts(this.value)">
    </div>

    <!-- 标签筛选 -->
    <div class="tag-filter" id="tag-filter"></div>

    <!-- 文章列表 -->
    <div id="post-list"></div>

    <!-- 空白状态 -->
    <div id="status">
      <span class="glitch">正在连接...</span>
    </div>

    <!-- 文章阅读视图 -->
    <div id="post-view">
      <button class="back-btn" onclick="goBack()"><< 返回列表</button>
      <div class="post-content" id="post-content"></div>
    </div>

    <!-- 图片画廊 -->
    <div class="gallery" id="gallery" style="display:none;">
      <h2>// 影像库 //</h2>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>

  </div>

  <!-- 图片放大查看 -->
  <div id="lightbox" onclick="closeLightbox(event)">
    <span id="lightbox-close" onclick="closeLightbox()">X</span>
    <div class="lightbox-frame">
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>

  <!-- 页脚 -->
  <footer>
    <span>✦</span> TI<span>A</span>NSHAN BLOG <span>✦</span><br>
    <small>Powered by Markdown + Cyberpunk</small>
  </footer>

  <!-- 帧动画背景（855 张图片 24fps，纯定时驱动，非视频 IDM 无法识别） -->
  <script>
    (function(){
      var total = 855, cur = 1, fps = 24, running = true;
      var bg = document.getElementById('video-bg');
      var img = document.createElement('img');
      img.id = 'frame-player';
      bg.appendChild(img);
      var ov = document.createElement('div');
      ov.id = 'video-overlay';
      bg.appendChild(ov);

      function pad(x) {
        return (x < 10 ? '000' : x < 100 ? '00' : x < 1000 ? '0' : '') + x;
      }

      // 预加载
      for (var k = 1; k <= total; k++) {
        var c = new Image();
        c.src = 'frames/f_' + pad(k) + '.jpg';
      }

      img.src = 'frames/f_' + pad(1) + '.jpg';

      setInterval(function() {
        if (!running) return;
        cur++;
        if (cur > total) cur = 1;
        img.src = 'frames/f_' + pad(cur) + '.jpg';
      }, 1000 / fps);
    })();
  </script>

  <!-- 背景音乐 -->
  <script>
    var musicPlaying = false;
    var musicBtn = document.getElementById('music-btn');
    var music = new Audio(atob('YXVkaW8vbS5tcDM='));
    music.loop = true;
    music.volume = 0.4;

    function toggleMusic() {
      if (musicPlaying) {
        music.pause();
        musicBtn.textContent = '♪';
        musicBtn.classList.remove('on');
        musicPlaying = false;
      } else {
        music.play().catch(function(){});
        musicBtn.textContent = '♫';
        musicBtn.classList.add('on');
        musicPlaying = true;
      }
    }

    // 尝试自动播放
    music.play().then(function() {
      musicBtn.textContent = '♫';
      musicBtn.classList.add('on');
      musicPlaying = true;
    }).catch(function() {
      // 浏览器阻止自动播放，首次点击页面任意位置时启动
      var startOnce = function() {
        if (!musicPlaying) {
          music.play().catch(function(){});
          musicBtn.textContent = '♫';
          musicBtn.classList.add('on');
          musicPlaying = true;
        }
        document.removeEventListener('click', startOnce);
        document.removeEventListener('touchstart', startOnce);
      };
      document.addEventListener('click', startOnce);
      document.addEventListener('touchstart', startOnce);
    });
  </script>

  <!-- marked.js -->
  <script src="js/marked.min.js"></script>
  <!-- 博客数据（加时间戳防缓存） -->
  <script>document.write('<script src="data.js?_='+Date.now()+'"><\/script>');</script>
  <!-- 主脚本 -->
  <script src="js/main.js"></script>

  <!-- 赛博朋克粒子拖尾（仅 PC 鼠标有效） -->
  <script>
    (function() {
      // 仅 PC 鼠标生效：检测当前主要输入设备是否为精细指针（鼠标）
      if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;

      var canvas = document.createElement('canvas');
      canvas.id = 'particle-trail';
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9998';
      document.body.appendChild(canvas);

      var ctx = canvas.getContext('2d');
      var W, H;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var particles = [];
      var colors = ['#00f0ff', '#ff0080', '#7000ff', '#00ff41', '#ffd700'];
      var maxParticles = 120;

      function addParticles(x, y, count, dx, dy) {
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var nx = dx / len;
        var ny = dy / len;
        for (var i = 0; i < count; i++) {
          if (particles.length >= maxParticles) {
            particles.shift();
          }
          // 粒子朝鼠标移动反方向散射（拖尾效果）
          var speed = Math.random() * 1.5 + 0.5;
          var angle = Math.atan2(-ny, -nx) + (Math.random() - 0.5) * 1.6;
          particles.push({
            x: x + (Math.random() - 0.5) * 8,
            y: y + (Math.random() - 0.5) * 8,
            vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 0.5,
            vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 0.5,
            size: Math.random() * 4 + 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1,
            decay: Math.random() * 0.025 + 0.015
          });
        }
      }

      var lastX = 0, lastY = 0, moved = false;
      document.addEventListener('mousemove', function(e) {
        if (!moved) {
          lastX = e.clientX;
          lastY = e.clientY;
          moved = true;
          return;
        }
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var count = Math.min(Math.floor(dist / 4) + 1, 3);
        // 粒子从光标尾部（非尖部）冒出
        addParticles(lastX + 18, lastY + 20, count, dx, dy);
        lastX = e.clientX;
        lastY = e.clientY;
      });

      function animate() {
        ctx.clearRect(0, 0, W, H);
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.02;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>

</body>
</html>
