<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中天山的博客</title>
  <link rel="icon" type="image/png" href="ICO/favicon.png" sizes="48x48">
  <link rel="icon" type="image/png" href="ICO/favicon-64.png" sizes="64x64">
  <link rel="icon" type="image/x-icon" href="ICO/favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="stylesheet" href="css/style.css?v=202607250001">
</head>
<body>
  <!-- 视频背景（由 JS 动态加载） -->
  <div id="video-bg"></div>
  <span class="bar-left"></span>
  <span class="bar-right"></span>
  <span class="bar-top"></span>
  <span class="bar-bottom"></span>

  <!-- 头部 -->
  <header>
    <div class="logo-ring"><img class="site-logo" src="images/logo.png" alt="中天山"></div>
    <h1>// 中天山 //</h1>
    <div class="subtitle">_ <span>博</span>客 _</div>
    <div class="scanline-header"></div>
    <div class="music-btn" id="music-btn" onclick="toggleMusic()">♪</div>
    <span class="music-btn" id="toggle-bars" onclick="toggleBars()" title="边框开关">▦</span>
    <span class="music-btn" id="toggle-letters" onclick="toggleLetters()" title="字母开关">A</span>
    <!-- 手机端汉堡菜单 -->
    <span class="hamburger" id="hamburger" onclick="toggleHamburger()">☰</span>
    <div class="hamburger-menu" id="hamburger-menu">
      <div class="hm-item" onclick="toggleMusic();closeHamburger()">♪ 背景音乐</div>
      <div class="hm-item" onclick="toggleBars();closeHamburger()">▦ 边框</div>
      <div class="hm-item" onclick="toggleLetters();closeHamburger()">A 字母粒子</div>
    </div>
  </header>

  <!-- 主内容 -->
  <div class="container">

    <!-- 标签切换 -->
    <div class="tabs">
      <span class="tab tab-active" data-tab="posts" onclick="switchTab('posts')">// 文章</span>
      <span class="tab" data-tab="gallery" onclick="switchTab('gallery')">// 影像库</span>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索文章..." oninput="searchPosts(this.value)">
    </div>

    <!-- 标签筛选 -->
    <div class="tag-filter" id="tag-filter"></div>

    <!-- 文章列表 -->
    <div id="post-list"></div>

    <!-- 空白状态 -->
    <div id="status">
      <span class="glitch">正在连接...</span>
    </div>

    <!-- 文章阅读视图 -->
    <div id="post-view">
      <button class="back-btn" onclick="goBack()"><< 返回列表</button>
      <div class="post-content" id="post-content"></div>
    </div>

    <!-- 图片画廊 -->
    <div class="gallery" id="gallery" style="display:none;">
      <h2>// 影像库 //</h2>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>

  </div>

  <!-- 标签选择弹窗 -->
  <div id="tag-picker" onclick="closeTagPicker(event)">
    <div class="tag-picker-box">
      <h3>选择标签</h3>
      <div class="tag-picker-list" id="tag-picker-list"></div>
      <button class="tag-picker-btn" onclick="applyTagPicker()">完成</button>
    </div>
  </div>

  <!-- 图片放大查看 -->
  <div id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-frame">
      <span class="corner-tl"></span>
      <span class="corner-tr"></span>
      <span class="corner-bl"></span>
      <span class="corner-br"></span>
      <span id="lightbox-close" onclick="closeLightbox()">X</span>
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>

  <!-- 页脚 -->
  <footer>
    <span>✦</span> 中<span>天</span>山 <span>✦</span><br>
    <small>Powered by Markdown + Cyberpunk</small>
  </footer>

  <!-- 背景音乐（最先下载：用户最感知到的） -->
  <script>
    var musicPlaying = false;
    var musicLoaded = false;
    var musicBtn = document.getElementById('music-btn');
    var music = new Audio(atob('YXVkaW8vbS5tcDM='));
    music.loop = true;
    music.volume = 0.4;
    music.preload = 'auto';
    music.load();
    musicBtn.classList.add('loading');

    music.addEventListener('canplaythrough', function() {
      musicLoaded = true;
      musicBtn.classList.remove('loading');
    });

    function toggleMusic() {
      if (musicPlaying) {
        music.pause();
        musicBtn.textContent = '♪';
        musicBtn.classList.remove('on');
        musicPlaying = false;
      } else {
        music.play().catch(function(){});
        musicBtn.textContent = '♫';
        musicBtn.classList.add('on');
        musicPlaying = true;
      }
      var mi = document.querySelectorAll('.hm-item');
      if (mi[0]) mi[0].classList.toggle('hm-on', musicPlaying);
    }

    music.play().then(function() {
      musicBtn.textContent = '♫';
      musicBtn.classList.add('on');
      musicPlaying = true;
      var mi = document.querySelectorAll('.hm-item');
      if (mi[0]) mi[0].classList.add('hm-on');
    }).catch(function() {
      var startOnce = function() {
        if (!musicPlaying) {
          music.play().catch(function(){});
          musicBtn.textContent = '♫';
          musicBtn.classList.add('on');
          musicPlaying = true;
          var mi = document.querySelectorAll('.hm-item');
          if (mi[0]) mi[0].classList.add('hm-on');
        }
        document.removeEventListener('click', startOnce);
        document.removeEventListener('touchstart', startOnce);
      };
      document.addEventListener('click', startOnce);
      document.addEventListener('touchstart', startOnce);
    });

    (function() {
      var mi = document.querySelectorAll('.hm-item');
      if (mi[1]) mi[1].classList.add('hm-on');
      if (mi[2]) mi[2].classList.add('hm-on');
    })();
  </script>

  <!-- 帧动画背景（延后加载：把带宽优先让给音频） -->
  <script>
    (function(){
      var total = 855, cur = 1, fps = 24, running = true;
      var bg = document.getElementById('video-bg');
      var img = document.createElement('img');
      img.id = 'frame-player';
      bg.appendChild(img);
      var ov = document.createElement('div');
      ov.id = 'video-overlay';
      bg.appendChild(ov);

      function pad(x) {
        return (x < 10 ? '000' : x < 100 ? '00' : x < 1000 ? '0' : '') + x;
      }

      // 延迟开始预加载（让音频先走）
      setTimeout(function() {
        for (var k = 1; k <= total; k++) {
          var c = new Image();
          c.src = 'frames/f_' + pad(k) + '.jpg';
        }
        img.src = 'frames/f_' + pad(1) + '.jpg';
      }, 2000);

      setInterval(function() {
        if (!running) return;
        cur++;
        if (cur > total) cur = 1;
        img.src = 'frames/f_' + pad(cur) + '.jpg';
      }, 1000 / fps);
    })();
  </script>

  <!-- marked.js -->
  <script src="js/marked.min.js?v=202607250001"></script>
  <!-- 博客数据（加时间戳防缓存） -->
  <script src="data.js"></script>
  <!-- 主脚本 -->
  <script src="js/main.js?v=202607250001"></script>

  <!-- 赛博朋克粒子拖尾（仅 PC 鼠标有效） -->
  <script>
    (function() {
      // 仅 PC 鼠标生效：检测当前主要输入设备是否为精细指针（鼠标）
      if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;

      var canvas = document.createElement('canvas');
      canvas.id = 'particle-trail';
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10198';
      document.body.appendChild(canvas);

      var ctx = canvas.getContext('2d');
      var W, H;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var particles = [];
      var colors = ['#00f0ff', '#ff0080', '#7000ff', '#00ff41', '#ffd700'];
      var maxParticles = 120;

      function addParticles(x, y, count, dx, dy) {
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var nx = dx / len;
        var ny = dy / len;
        for (var i = 0; i < count; i++) {
          if (particles.length >= maxParticles) {
            particles.shift();
          }
          // 粒子朝鼠标移动反方向散射（拖尾效果）
          var speed = Math.random() * 1.5 + 0.5;
          var angle = Math.atan2(-ny, -nx) + (Math.random() - 0.5) * 1.6;
          particles.push({
            x: x + (Math.random() - 0.5) * 8,
            y: y + (Math.random() - 0.5) * 8,
            vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 0.5,
            vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 0.5,
            size: Math.random() * 4 + 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1,
            decay: Math.random() * 0.025 + 0.015
          });
        }
      }

      var lastX = 0, lastY = 0, moved = false;
      document.addEventListener('mousemove', function(e) {
        if (!moved) {
          lastX = e.clientX;
          lastY = e.clientY;
          moved = true;
          return;
        }
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var count = Math.min(Math.floor(dist / 4) + 1, 3);
        // 粒子从光标尾部（非尖部）冒出
        addParticles(lastX + 18, lastY + 20, count, dx, dy);
        lastX = e.clientX;
        lastY = e.clientY;
      });

      function animate() {
        ctx.clearRect(0, 0, W, H);
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.02;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>


  <!-- 边缘字母粒子特效 -->
  <script>
    (function() {
      var canvas = document.createElement('canvas');
      canvas.id = 'edge-letters';
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:101';
      document.body.appendChild(canvas);

      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var W, H;
      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);
      // 手机版降低上限保性能
      var isMobile = !window.matchMedia || !window.matchMedia('(pointer: fine)').matches;
      var MAX_PARTICLES = isMobile ? 60 : 150;

      var particles = [];
      var colors = ['#ff0040', '#ff6600', '#ffd700', '#00ff41', '#00f0ff'];
      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

      function canSpawnAt(scrollY, edge) {
        var docH = document.documentElement.scrollHeight;
        if (edge === 2) return scrollY < 5;                    // 顶边：只在最顶部
        if (edge === 3) return scrollY + H >= docH - 5;        // 底边：只在最底部
        return true;                                            // 左右边：始终
      }

      function spawnParticle() {
        var edge = Math.floor(Math.random() * 4);
        if (!canSpawnAt(window.scrollY, edge)) return;
        var x, y, vx, vy;
        switch(edge) {
          case 0:
            x = 0;
            y = Math.random() * H;
            vx = Math.random() * 0.6 + 0.3;
            vy = (Math.random() - 0.5) * 0.3;
            break;
          case 1:
            x = W;
            y = Math.random() * H;
            vx = -(Math.random() * 0.6 + 0.3);
            vy = (Math.random() - 0.5) * 0.3;
            break;
          case 2:
            x = Math.random() * W;
            y = 0;
            vx = (Math.random() - 0.5) * 0.3;
            vy = Math.random() * 0.6 + 0.3;
            break;
          case 3:
            x = Math.random() * W;
            y = H;
            vx = (Math.random() - 0.5) * 0.3;
            vy = -(Math.random() * 0.6 + 0.3);
            break;
        }

        particles.push({
          x: x, y: y, vx: vx, vy: vy,
          char: chars[Math.floor(Math.random() * chars.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 14 + 10,
          life: 1,
          decay: Math.random() * 0.012 + 0.002
        });
      }

      // 每 200-500ms 随机生成一个
      function scheduleSpawn() {
        setTimeout(function() {
          if (particles.length < MAX_PARTICLES) { spawnParticle(); if (Math.random() < 0.4) spawnParticle(); }
          scheduleSpawn();
        }, Math.random() * 100 + 50);
      }
      scheduleSpawn();

      function animate() {
        ctx.clearRect(0, 0, W, H);
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          var alpha = 0.5 * p.life;
          ctx.globalAlpha = alpha;
          ctx.font = p.size + 'px "Minecraft", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 12;
          ctx.fillStyle = p.color;
          ctx.fillText(p.char, p.x, p.y);
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>


  <!-- 开关控制 -->
  <script>
    var barsVisible = true;
    var lettersVisible = true;

    function toggleBars() {
      barsVisible = !barsVisible;
      var bars = document.querySelectorAll('.bar-left, .bar-right, .bar-top, .bar-bottom');
      var display = barsVisible ? '' : 'none';
      bars.forEach(function(b) { b.style.display = display; });
      document.getElementById('toggle-bars').classList.toggle('off', !barsVisible);
      // 同步汉堡菜单状态
      var mi = document.querySelectorAll('.hm-item');
      if (mi[1]) mi[1].classList.toggle('hm-on', barsVisible);
    }

    function toggleLetters() {
      lettersVisible = !lettersVisible;
      var canvas = document.getElementById('edge-letters');
      if (canvas) canvas.style.display = lettersVisible ? '' : 'none';
      document.getElementById('toggle-letters').classList.toggle('off', !lettersVisible);
      // 同步汉堡菜单状态
      var mi = document.querySelectorAll('.hm-item');
      if (mi[2]) mi[2].classList.toggle('hm-on', lettersVisible);
    }

    function toggleHamburger() {
      var btn = document.getElementById('hamburger');
      var menu = document.getElementById('hamburger-menu');
      var open = menu.classList.toggle('open');
      btn.classList.toggle('open', open);
    }

    function closeHamburger() {
      var btn = document.getElementById('hamburger');
      var menu = document.getElementById('hamburger-menu');
      menu.classList.remove('open');
      btn.classList.remove('open');
    }

    // 点击汉堡菜单外部关闭菜单
    document.addEventListener('click', function(e) {
      var menu = document.getElementById('hamburger-menu');
      var btn = document.getElementById('hamburger');
      if (menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
        btn.classList.remove('open');
      }
    });
  </script>

  <!-- 注册 Service Worker：缓存帧动画到本地设备 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>

</body>
</html>
